name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install CGO deps (SQLite)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev

      - name: go test
        run: go test ./...

      - name: go vet
        run: go vet ./...
